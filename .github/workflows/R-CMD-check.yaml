# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

# The workflow only checks out the repository and runs R CMD check, so
# read-only permissions on everything are sufficient (uploading snapshot
# artifacts needs no write scope).
permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Windows on R-devel is the combination win-builder checks, and the one
          # the rest of this matrix leaves uncovered (Windows is otherwise only
          # on release, R-devel only on Linux). Running it here gives the same
          # signal on every push, rather than by email after an upload.
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The version floors in DESCRIPTION are a promise to anyone resolving against
  # an older stack, and nothing tested them: setup-r-dependencies always
  # resolves the newest CRAN versions, so the matrix above only ever exercises
  # the ceiling. This job installs the declared minima and runs the suite
  # against them. A failure here means a floor needs raising to what actually
  # works, not that the job is too strict -- that is how the patchwork floor
  # was found to be a release too low.
  #
  # Note that this pins the packages, not R. r-lib/actions does not reach back
  # to the declared R 4.1.0 floor, so oldrel-3 is the oldest R exercised
  # anywhere here and the R floor itself remains an untested claim.
  minimum-versions:
    runs-on: ubuntu-latest

    name: Declared minimum dependencies

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          r-version: 'oldrel-3'
          use-public-rspm: true

      # Deriv is pinned to work around an upstream metadata bug, not because this
      # package cares which version it gets: it arrives only as a dependency of
      # simr, itself a Suggests. Deriv 4.3.0 (2026-07-23) calls R_ClosureFormals
      # and Rf_allocLang, both added to the C API in R 4.5, but its DESCRIPTION
      # declares Depends: Rcpp and names no R version at all. pak therefore
      # offers it to the R pinned below, where it fails to compile and takes the
      # whole job down before a line of depictr runs. 4.2.0 is the last release
      # before Deriv gained compiled code at all -- NeedsCompilation: no, pure R
      # over methods -- so it cannot fail this way on any R. Drop the pin once
      # Deriv declares its R requirement, or once oldrel-3 has moved past R 4.3.
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          extra-packages: any::testthat, Deriv@4.2.0
          needs: check

      # Downgrade over the resolved versions, then print what we ended up with
      # so a silent no-op cannot masquerade as a passing floor check.
      - name: Install the declared minima
        shell: Rscript {0}
        run: |
          pak::pkg_install(c("ggplot2@3.5.0", "patchwork@1.3.0"), ask = FALSE)
          for (p in c("ggplot2", "patchwork")) {
            cat(p, as.character(packageVersion(p)), "\n")
          }
          stopifnot(
            packageVersion("ggplot2") == "3.5.0",
            packageVersion("patchwork") == "1.3.0"
          )

      - name: Run the test suite against the floors
        shell: Rscript {0}
        run: testthat::test_local(stop_on_failure = TRUE)

  # An @export that never reaches NAMESPACE is invisible to the test suite:
  # testthat runs inside the package namespace, where unexported internals are
  # reachable too, so a dropped export passes every test and surfaces only once
  # a user calls the function. This job regenerates NAMESPACE from the roxygen
  # comments and fails when the committed copy differs.
  #
  # NAMESPACE alone is gated. man/*.Rd is the obvious companion and is left out
  # deliberately: Rd formatting churns between roxygen2 releases, so gating it
  # would redden the job on upgrades that changed nothing about the package.
  namespace-check:
    runs-on: ubuntu-latest

    name: NAMESPACE matches the roxygen tags

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          r-version: 'release'
          use-public-rspm: true

      # roxygen2 is pinned rather than resolved. Left floating, a release that
      # changed its output would fail this job on a commit that touched nothing.
      # The package dependencies come along because roxygen loads the package to
      # read its roxygen blocks.
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          extra-packages: roxygen2@8.0.0
          needs: check

      - name: Check the pinned roxygen2 against DESCRIPTION
        shell: Rscript {0}
        run: |
          installed <- as.character(packageVersion("roxygen2"))
          cat("roxygen2 installed:", installed, "\n")
          desc <- read.dcf("DESCRIPTION")
          field <- intersect(c("Config/roxygen2/version", "RoxygenNote"), colnames(desc))
          if (length(field) == 0) {
            cat("DESCRIPTION records no roxygen2 version, so there is nothing to compare.\n")
          } else {
            recorded <- trimws(as.character(desc[1, field[1]]))
            cat("DESCRIPTION", paste0(field[1], ":"), recorded, "\n")
            if (!identical(installed, recorded)) {
              stop(
                "roxygen2 ", installed, " is installed but DESCRIPTION records ", recorded,
                ". A diff from this job would then reflect the roxygen2 version difference ",
                "rather than a stale NAMESPACE. Update whichever of the two is behind: the ",
                "pin in this workflow, or DESCRIPTION by running devtools::document().",
                call. = FALSE
              )
            }
          }

      # roxygenise() rewrites NAMESPACE only when the file carries its header,
      # and says nothing when it does not. Without this check a header lost in
      # an edit would leave the job green over a file nothing regenerates, which
      # is the failure it exists to catch.
      - name: Regenerate NAMESPACE from the roxygen comments
        shell: Rscript {0}
        run: |
          header <- readLines("NAMESPACE", n = 1L, warn = FALSE)
          if (!any(grepl("Generated by roxygen2", header, fixed = TRUE))) {
            stop(
              "NAMESPACE has lost its \"# Generated by roxygen2: do not edit by hand\" ",
              "first line, so roxygenise() will skip it and this job can no longer fail. ",
              "Restore the header.",
              call. = FALSE
            )
          }
          roxygen2::roxygenise(".", roclets = "namespace")

      - name: Fail if NAMESPACE drifted
        run: |
          if ! git diff --exit-code -- NAMESPACE; then
            echo
            echo "NAMESPACE is out of date with the roxygen tags in R/."
            echo "The diff above is what regenerating the file produced: the lines"
            echo "marked + are what the committed NAMESPACE is missing."
            echo "Fix it by running devtools::document() locally and committing NAMESPACE."
            exit 1
          fi
