# Scheduled check of depictr against current and development dependency versions.
# It runs daily (and on demand) so that a breaking change in any
# dependency is caught quickly. On failure it opens, or comments on, a single
# issue to flag the maintainer; the companion dependency-autofix workflow can
# attempt a fix first when a Claude Code OAuth token is configured.
name: dependency-check

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { label: "current dependencies (R release)", r: "release", dev: false }
          - { label: "development dependencies (R devel)", r: "devel", dev: true }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install development versions of the key dependencies
        if: matrix.config.dev
        run: |
          pak::pkg_install(c(
            "tidyverse/ggplot2",
            "thomasp85/patchwork",
            "r-lib/scales",
            "r-lib/rlang",
            "tidyverse/stringr"
          ))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: false
          error-on: '"warning"'

      # The issue is raised with the gh CLI rather than a third-party action:
      # gh already ships on the runner and does the same job without adding an
      # unpinned dependency to the supply chain. The title and label are read
      # from the template's front matter, so the template file stays the single
      # source of truth for the issue content. Deduplication is by title, which
      # also means that when both matrix legs fail, the second leg comments on
      # the issue the first one opened.
      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG: ${{ matrix.config.label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          template=.github/issue-templates/dependency-issue.md
          title=$(sed -n 's/^title: *"\(.*\)"$/\1/p' "$template")
          label=$(sed -n 's/^labels: *//p' "$template")
          # The body is the template minus its front matter, with the
          # {{ env.* }} placeholders filled in.
          sed '1,/^---$/d' "$template" \
            | sed -e "s|{{ env.CONFIG }}|$CONFIG|g" \
                  -e "s|{{ env.RUN_URL }}|$RUN_URL|g" > issue-body.md
          gh label create "$label" --color ededed \
            --description "Dependency maintenance" 2>/dev/null || true
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md \
              --label "$label"
          fi
