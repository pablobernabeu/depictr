# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Remove the redundant, unrendered licence stub page
        # pkgdown always renders the bare LICENSE file (needed for CRAN's
        # "MIT + file LICENSE" field) to its own orphaned page, alongside the
        # full text built from LICENSE.md. Keep only the full-text page live,
        # and drop the markdown copy pkgdown leaves beside the stub.
        #
        # The sitemap entry has to go with the page. pkgdown writes sitemap.xml
        # before this step runs, so deleting the page alone left a <loc>
        # advertising a URL that 404s, and search engines read the sitemap and
        # follow it. pkgdown emits one <url> per line, so a line filter removes
        # exactly that entry.
        run: |
          rm -f docs/LICENSE-text.html docs/LICENSE-text.md
          if [ -f docs/sitemap.xml ]; then
            grep -v '/LICENSE-text\.html<' docs/sitemap.xml > docs/sitemap.new || true
            if [ -s docs/sitemap.new ]; then
              mv docs/sitemap.new docs/sitemap.xml
            else
              rm -f docs/sitemap.new
            fi
          fi

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
        with:
          # clean: true, so that files dropped from the build, such as a page
          # whose source moved out of pkgdown's scan path, are removed from the
          # live site. gh-pages holds only the pkgdown output, so a full mirror
          # is safe.
          clean: true
          branch: gh-pages
          folder: docs

      - name: Check that the sidebar shows the DOI once, as a link
        # pkgdown copies the README's DOI badge into Dev status, where
        # pkgdown/extra.scss hides it, and the Citation component gives the DOI
        # as a link. This fails if pkgdown's markup or the compiled stylesheet
        # stops matching those rules, which would bring the duplicate back. It
        # runs after the deployment, so that a failure marks the run red without
        # holding the site back.
        run: python3 .github/check_doi_display.py --site docs
