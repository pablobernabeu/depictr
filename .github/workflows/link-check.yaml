# Scheduled link-rot check for depictr.
#
# CRAN flags moved and broken URLs, so this workflow runs urlchecker over the
# package sources (DESCRIPTION, README, help pages and vignettes) on a weekly
# cadence (and on demand). On failure it opens, or comments on, a single issue
# so a broken or redirecting link can be fixed before it becomes a CRAN problem.
name: link-check

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install urlchecker and the package itself: urlchecker expands the Rdpack
      # \insertRef macros in the help pages, which needs depictr (and its bundled
      # inst/REFERENCES.bib) on the library path.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::urlchecker, local::.
          needs: check

      - name: Check URLs with urlchecker
        run: |
          problems <- urlchecker::url_check(".")
          print(problems)
          if (nrow(problems) > 0) {
            stop(sprintf("urlchecker found %d problem URL(s).", nrow(problems)))
          }
          cat("All URLs OK.\n")
        shell: Rscript {0}

      # The issue is raised with the gh CLI rather than a third-party action:
      # gh already ships on the runner and does the same job without adding an
      # unpinned dependency to the supply chain. The title and label are read
      # from the template's front matter, so the template file stays the single
      # source of truth for the issue content.
      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          template=.github/issue-templates/link-issue.md
          title=$(sed -n 's/^title: *"\(.*\)"$/\1/p' "$template")
          label=$(sed -n 's/^labels: *//p' "$template")
          # The body is the template minus its front matter, with the
          # {{ env.* }} placeholder filled in.
          sed '1,/^---$/d' "$template" \
            | sed -e "s|{{ env.RUN_URL }}|$RUN_URL|g" > issue-body.md
          gh label create "$label" --color 0075ca \
            --description "Improvements or additions to documentation" \
            2>/dev/null || true
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md \
              --label "$label"
          fi
