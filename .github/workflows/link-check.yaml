# Scheduled link-rot check for depictr.
#
# CRAN flags moved and broken URLs, so this workflow runs urlchecker over the
# package sources (DESCRIPTION, README, help pages and vignettes) on a weekly
# cadence (and on demand). On failure it opens, or comments on, a single issue
# so a broken or redirecting link can be fixed before it becomes a CRAN problem.
# A URL that the runner cannot reach at all, by a timeout or a connection
# error, is asked again and, if it still gives no answer, reported as a
# warning, which neither fails the run nor touches the issue.
name: link-check

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays at 05:00 UTC
  workflow_dispatch:
    inputs:
      url:
        description: "Check only this URL, to see how the job reports it. No issue is opened or updated."
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      # Install urlchecker and the package itself: urlchecker expands the Rdpack
      # \insertRef macros in the help pages, which needs depictr (and its bundled
      # inst/REFERENCES.bib) on the library path.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          extra-packages: any::urlchecker, local::.
          needs: check

      # GitHub's runners sometimes cannot reach a host at all: each failing run
      # from 26 October to 9 November 2026 timed out reaching CRAN.R-project.org
      # (issue #23). Such a failure says nothing about the link, so a URL that
      # got no HTTP answer, by a timeout or a connection error, is asked again
      # three times, 15 seconds apart. If it answers, its status decides as
      # usual. If it never answers, the run reports it as a warning and passes.
      # An HTTP error (404, 410, 500 and so on), a moved URL, a certificate
      # error or a CRAN URL not in canonical form fails the run as before.
      - name: Check URLs with urlchecker
        env:
          TEST_URL: ${{ inputs.url }}
        run: |
          # A run started by hand with the 'url' input checks that URL alone.
          test_url <- Sys.getenv("TEST_URL")
          db <- NULL
          if (nzchar(test_url)) {
            db <- data.frame(URL = test_url, Parent = "the 'url' input")
          }

          # url_check() returns a table of the URLs that failed. The step
          # reports them itself, without urlchecker's print method.
          res <- urlchecker::url_check(".", db = db, progress = FALSE)
          column <- function(name) {
            if (name %in% names(res)) as.character(res[[name]]) else rep("", nrow(res))
          }
          status <- column("Status")
          reason <- column("Message")
          new <- column("New")
          cran <- column("CRAN")
          spaces <- column("Spaces")
          http_r <- column("R")
          from <- vapply(res$From, function(f) paste(f, collapse = ", "), "")

          # urlchecker gives the status 'Error' when curl got no HTTP answer.
          # These messages mean that the runner did not reach the host. A
          # certificate error is not among them, since CRAN reports it.
          network <- paste(
            "Timeout was reached", "timed out", "resolve host", "Couldn't resolve",
            "Couldn't connect", "Failed to connect", "Connection refused",
            "Connection reset", "Recv failure", "Send failure", "receiving data",
            "sending data", "Empty reply", "returned nothing", "HTTP/2 stream",
            sep = "|"
          )
          flagged <- nzchar(new) | nzchar(cran) | nzchar(spaces) | nzchar(http_r)
          unreached <- status == "Error" & !flagged & grepl(network, reason, ignore.case = TRUE)

          # Asks as R CMD check does: HEAD, then GET if HEAD gets no 200.
          # Gives the HTTP status, or curl's message if there was no answer.
          probe <- function(url) {
            ask <- function(head) {
              h <- curl::new_handle(nobody = head, followlocation = TRUE,
                                    connecttimeout = 20, timeout = 60)
              if (grepl("^https?://github[.]com", url) && nzchar(Sys.getenv("GITHUB_PAT"))) {
                curl::handle_setheaders(h, Authorization = paste("token", Sys.getenv("GITHUB_PAT")))
              }
              tryCatch(curl::curl_fetch_memory(url, handle = h)$status_code,
                       error = function(e) conditionMessage(e))
            }
            answer <- ask(TRUE)
            if (is.numeric(answer) && answer != 200) {
              again <- ask(FALSE)
              if (is.numeric(again)) answer <- again
            }
            answer
          }

          answers <- vector("list", nrow(res))
          pending <- which(unreached)
          for (attempt in 1:3) {
            if (length(pending) == 0) break
            Sys.sleep(15)
            for (i in pending) answers[[i]] <- probe(res$URL[i])
            pending <- pending[!vapply(answers[pending], is.numeric, NA)]
          }
          passed <- rep(FALSE, nrow(res))
          for (i in which(unreached)) {
            if (is.numeric(answers[[i]])) {
              unreached[i] <- FALSE
              passed[i] <- answers[[i]] %in% c(200, 405)
              status[i] <- as.character(answers[[i]])
              reason[i] <- "HTTP status when asked again"
            } else {
              reason[i] <- answers[[i]]
            }
          }
          broken <- !unreached & !passed

          # GitHub shows a line that starts with '::warning' or '::error' as an
          # annotation of the run. '%', CR and LF in its text are escaped.
          annotate <- function(level, title, text) {
            text <- gsub("%", "%25", text, fixed = TRUE)
            text <- gsub("\r", "%0D", text, fixed = TRUE)
            text <- gsub("\n", "%0A", text, fixed = TRUE)
            cat(sprintf("::%s title=%s::%s\n", level, title, text))
          }
          for (i in which(passed)) {
            cat(sprintf("%s (in %s) answered when asked again.\n", res$URL[i], from[i]))
          }
          for (i in which(unreached)) {
            annotate("warning", "URL not reached", sprintf(
              "%s (in %s) gave no answer, also when asked three more times: %s",
              res$URL[i], from[i], reason[i]))
          }
          what <- ifelse(nzchar(new), paste("moved to", new),
                  ifelse(nzchar(cran), "CRAN URL not in canonical form",
                  ifelse(nzchar(spaces), "the URL contains spaces",
                  ifelse(nzchar(http_r), "use https for r-project.org",
                  ifelse(nzchar(status), paste0(status, ": ", reason), reason)))))
          for (i in which(broken)) {
            annotate("error", "Broken URL", sprintf("%s (in %s): %s", res$URL[i], from[i], what[i]))
          }
          if (any(broken)) {
            stop(sprintf("urlchecker found %d broken or moved URL(s).", sum(broken)), call. = FALSE)
          }
          cat("No broken or moved URLs.\n")
          if (any(unreached)) {
            cat(sprintf("%d URL(s) gave no answer. See the warnings.\n", sum(unreached)))
          }
        shell: Rscript {0}

      # The issue is raised with the gh CLI rather than a third-party action:
      # gh already ships on the runner and does the same job without adding an
      # unpinned dependency to the supply chain. The title and label are read
      # from the template's front matter, so the template file stays the single
      # source of truth for the issue content. A run that checks the 'url' input
      # leaves the issue alone.
      - name: Open or update an issue on failure
        if: failure() && !inputs.url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          template=.github/issue-templates/link-issue.md
          title=$(sed -n 's/^title: *"\(.*\)"$/\1/p' "$template")
          label=$(sed -n 's/^labels: *//p' "$template")
          # The body is the template minus its front matter, with the
          # {{ env.* }} placeholder filled in.
          sed '1,/^---$/d' "$template" \
            | sed -e "s|{{ env.RUN_URL }}|$RUN_URL|g" > issue-body.md
          gh label create "$label" --color 0075ca \
            --description "Improvements or additions to documentation" \
            2>/dev/null || true
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md \
              --label "$label"
          fi
