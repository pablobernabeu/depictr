# Optional automated fix attempt for dependency breakages.
#
# When the scheduled dependency-check workflow fails, this workflow asks Claude
# Code to investigate and, where it can do so safely, to open a pull request with
# a fix. It is inert until a CLAUDE_CODE_OAUTH_TOKEN secret is added to the
# repository (generate it with `claude setup-token`, which authorises a Claude
# subscription rather than billable API credits); without that secret the step
# is skipped and the dependency-check issue remains the means of flagging the
# maintainer. Opening pull requests also requires enabling "Allow GitHub Actions
# to create and approve pull requests" under Settings > Actions > General.
name: dependency-autofix

on:
  workflow_run:
    workflows: ["dependency-check"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check

      - name: Attempt an automated fix with Claude Code
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # anthropics is outside the small set of publishers whose actions this
        # repository trusts on a floating major tag, so the action is pinned to
        # the exact release commit named in the trailing comment.
        uses: anthropics/claude-code-action@34968b5981d5d170904281aa3df6f3c0d4a28855 # v1.0.249
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this input the action asks for an OIDC token to exchange
          # for the Claude GitHub App's token, and the step fails with "Could
          # not fetch an OIDC token" because the job has no `id-token: write`.
          # The workflow's own token can open pull requests only when "Allow
          # GitHub Actions to create and approve pull requests" is enabled
          # under Settings > Actions > General. GitHub starts no workflow runs
          # for events made with this token, so a maintainer has to start
          # R-CMD-check on the pull request it opens.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: >
            The scheduled dependency-check workflow for this R package is
            failing, most likely because a dependency released a change that
            breaks the package. Reproduce the failure by running
            rcmdcheck::rcmdcheck(args = "--no-manual"). Identify the smallest
            change that restores compatibility with the current dependency
            versions, preferring to adapt our code to the dependency's new
            behaviour rather than pinning an old version. Re-run the check and
            the tests until they pass, run roxygen2::roxygenise() if any
            documentation changed, then open a pull request describing the
            dependency change and the fix. If the failure cannot be resolved
            safely without a larger redesign, do not force a change: instead
            summarise the cause and the options in a comment on the open
            "Dependency check is failing" issue.
          claude_args: '--allowedTools "Bash,Edit,Read,Write,Grep,Glob"'
